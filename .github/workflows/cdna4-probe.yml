name: Probe CDNA4 grouped-reduce skip (fork only)

on:
  push:
    branches: [bounty/cdna4-emulator-ci]
    paths: ['.github/workflows/cdna4-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grouped-reduce:
    strategy:
      fail-fast: false
      matrix:
        backend: [amd, amdllvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DEV: ${{ matrix.backend == 'amdllvm' && 'MOCKKFD+AMD:LLVM:gfx950' || 'MOCKKFD+AMD::gfx950' }}
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup-tinygrad
        with:
          key: ${{ matrix.backend }}-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: Probe previously skipped grouped reduce without editing tests
        run: |
          python - <<'PY'
          import unittest, inspect
          from test.runtime.test_kernel_opts import TestKernelOpts
          # The fork intentionally enables this test on gfx950 already; execute it unmodified.
          test = TestKernelOpts.test_local_and_grouped_reduce
          if getattr(test, '__unittest_skip__', False):
            raw = inspect.unwrap(test)
            raw.__unittest_skip__ = False
            TestKernelOpts.test_local_and_grouped_reduce = raw
          suite = unittest.TestSuite([TestKernelOpts('test_local_and_grouped_reduce')])
          r = unittest.TextTestRunner(verbosity=2).run(suite)
          if not r.wasSuccessful() or r.testsRun != 1 or len(r.skipped) != 0: raise SystemExit(1)
          PY

  asm-gemm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEV: MOCKKFD+AMD:LLVM:gfx950
      PYTHONPATH: .
      OMP_NUM_THREADS: 1
      PYTHONFAULTHANDLER: 1
      DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup emulator
        uses: ./.github/actions/setup-tinygrad
        with:
          key: amdllvm-minimal
          deps: testing_unit
          amd: 'true'
          llvm: 'true'
      - name: Install ROCm HIP compiler for actual assembly tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hipcc hip-dev rocm-device-libs
          export PATH="/opt/rocm/bin:$PATH"
          command -v hipcc
          hipcc --version
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
      - name: Instrument native emulator call site (diagnostic job only)
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("test/mockgpu/amd/emu.py")
          src = path.read_text()
          needle = "          fxn((ctypes.c_uint64 * len(globals_list))(*[c_bufs[g] for g in globals_list]))"
          assert src.count(needle) == 1
          added = "\n".join([
            "          if gidx == gidy == gidz == 0 and 4650 <= pc - lib <= 6200:",
            "            import sys",
            "            print(f'[TRACE] wave={wi} pc={pc-lib} {inst!r}', file=sys.stderr, flush=True)",
            "            if wi == 0 and pc-lib in (5164,5172):",
            "              inst_raw = int.from_bytes(ctypes.string_at(pc,8),'little')",
            "              regnum = (inst_raw >> 32) & 255",
            "              vg = (ctypes.c_uint32 * (256*wave_size)).from_address(st.vgpr_buf._buf)",
            "              ac = (ctypes.c_uint32 * (256*wave_size)).from_address(st.accvgpr_buf._buf)",
            "              print(f'[RAW] pc={pc-lib} word={inst_raw:#018x} accflag={(inst_raw >> 25)&1} reg=v{regnum} addr0={vg[regnum*wave_size]:#x} vg192={vg[192*wave_size]:#x} acc192={ac[192*wave_size]:#x}', file=sys.stderr, flush=True)",
            "          if isinstance(inst, irc.DS) and _op_name(inst) == 'DS_READ_B64_TR_B16':",
            "            raw = int.from_bytes(ctypes.string_at(pc, 8), 'little')",
            "            addr_reg, offset = (raw >> 32) & 255, raw & 65535",
            "            vgpr = (ctypes.c_uint32 * (256 * wave_size)).from_address(st.vgpr_buf._buf)",
            "            for lane in range(wave_size):",
            "              src_base = (lane & -16) + ((lane & 15) >> 2)",
            "              for row in range(4):",
            "                src_lane = src_base + row * 4",
            "                addr = (vgpr[addr_reg * wave_size + src_lane] + offset + (lane & 3) * 2) & 0xffffffff",
            "                if addr + 2 > lds_size:",
            "                  raise RuntimeError(f'CDNA4 transpose OOB wave={wi} pc={pc-lib} addr_reg=v{addr_reg} source_lane={src_lane} dest_lane={lane} addr={addr} offset={offset} lds_size={lds_size}')",
          ]) + "\n"
          src = src.replace(needle, added + needle)
          path.write_text(src)
          PY
      - name: Run original GEMM correctness tests with emulator skip lifted
        run: |
          ulimit -c 0
          python -X faulthandler - <<'PY'
          import unittest, inspect
          from test.device.amd.test_asm_gemm import TestAsmGEMM
          names = ('test_tiny', 'test_verify_with_numpy')
          # unittest.skipIf wraps the function with a SkipTest-raising wrapper.
          # Run the actual original body, preserving its assertions and setUp checks.
          for name in names:
            original = inspect.unwrap(getattr(TestAsmGEMM, name))
            assert original.__name__ == name
            setattr(TestAsmGEMM, name, original)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(TestAsmGEMM(name) for name in names))
          if not result.wasSuccessful() or result.testsRun != len(names) or result.skipped:
            raise SystemExit(1)
          PY
